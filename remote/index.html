<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0507">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="프리쇼 리모컨">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>프리쇼 리모컨</title>
<style>
:root { --bg: #0A0507; --panel: #1A0D11; --panel2: #26141A; --line: #3A1F26; --line2: #5A3D44; --gold: #E8C27A; --text: #F6EFE2; --soft: #E6DCCB; --muted: #C9B8A6; --ok: #7FD6A2; --warn: #FFB86B; --bad: #FF8A7A; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif; font-size: 16px; }
body { min-height: 100vh; padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 32px); }
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.hide { display: none !important; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0 4px; }
header h1 { margin: 0; font-size: 20px; font-weight: 900; display: flex; align-items: center; gap: 10px; }
header h1 i { width: 11px; height: 11px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 12px var(--gold); }
.pill { font-size: 13px; font-weight: 700; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line2); color: var(--muted); white-space: nowrap; }
.pill.ok { border-color: var(--ok); color: var(--ok); } .pill.bad { border-color: var(--bad); color: var(--bad); } .pill.warn { border-color: var(--warn); color: var(--warn); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.card h2 { margin: 0; font-size: 14px; font-weight: 700; color: var(--muted); }
label { font-size: 13px; font-weight: 700; color: var(--muted); }
input[type="text"], input[type="password"], input[type="time"], select, textarea { width: 100%; min-height: 48px; padding: 10px 12px; background: #120A0C; border: 1px solid var(--line2); border-radius: 10px; color: var(--text); font: inherit; color-scheme: dark; }
textarea { resize: vertical; line-height: 1.5; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
button { min-height: 48px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line2); background: transparent; color: var(--text); font: inherit; font-weight: 700; cursor: pointer; }
button:active { transform: scale(.97); }
button.primary { background: var(--gold); border-color: var(--gold); color: #0A0507; }
button.outline { border-color: var(--gold); color: var(--gold); }
button.danger { border-color: var(--bad); color: var(--bad); }
button:disabled { opacity: .4; }
.row { display: flex; gap: 8px; } .row > * { flex: 1; min-width: 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.hint { font-size: 13px; color: var(--muted); line-height: 1.5; }

/* 현황 */
.now { background: var(--panel2); border-color: var(--gold); }
.now .phase { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.now .phase b { font-size: 18px; }
.now .clock { font-size: 64px; font-weight: 900; line-height: 1; letter-spacing: 1px; font-variant-numeric: tabular-nums; color: #FFF6E4; }
.now .sub { font-size: 14px; color: var(--muted); }
.now .title { font-size: 20px; font-weight: 900; color: var(--gold); word-break: keep-all; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; margin: 0; }
.facts dt { color: var(--muted); } .facts dd { margin: 0; text-align: right; word-break: keep-all; }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--gold); transition: width .8s linear; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 15px; font-weight: 700; color: var(--text); min-height: 48px; }
.switch input { width: 24px; height: 24px; accent-color: var(--gold); }
.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.presets button { min-height: 40px; font-size: 13px; font-weight: 500; padding: 0 12px; }
#toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 20px); transform: translateX(-50%); max-width: 90vw; padding: 12px 18px; border-radius: 12px; background: #000; border: 1px solid var(--line2); color: #fff; font-size: 15px; font-weight: 700; opacity: 0; transition: opacity .25s; pointer-events: none; text-align: center; z-index: 9; }
#toast.on { opacity: 1; } #toast.ok { border-color: var(--ok); } #toast.bad { border-color: var(--bad); color: var(--bad); }
.dim { opacity: .45; pointer-events: none; }
.vol { display: flex; align-items: center; gap: 14px; }
.vol input { flex: 1; min-height: 48px; accent-color: var(--gold); }
.vol b { width: 62px; text-align: right; font-size: 20px; font-variant-numeric: tabular-nums; }
button.active { background: var(--bad); border-color: var(--bad); color: #0A0507; }
.nlist { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; counter-reset: n; }
.nlist li { counter-increment: n; display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 12px; background: #120A0C; border: 1px solid var(--line2); border-radius: 10px; font-size: 14px; }
.nlist li::before { content: counter(n); flex: 0 0 22px; height: 22px; border-radius: 50%; background: var(--gold); color: #0A0507; font-size: 12px; font-weight: 900; display: flex; align-items: center; justify-content: center; }
.nlist li span { flex: 1; min-width: 0; word-break: keep-all; white-space: pre-line; }
.nlist li button { flex: 0 0 40px; min-height: 40px; padding: 0; font-size: 18px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><i></i>프리쇼 리모컨</h1>
    <span class="pill" id="conn">연결 안 됨</span>
  </header>

  <!-- 비밀번호 입력 -->
  <section class="card" id="login">
    <h2>연결</h2>
    <label for="pw">리모컨 비밀번호</label>
    <input id="pw" type="password" autocomplete="current-password" placeholder="상영 프로그램 [설정]에 넣은 비밀번호">
    <button type="button" class="primary" id="btnLogin">연결</button>
    <div class="hint">상영 프로그램의 [설정] → 휴대전화 리모컨에서 정한 비밀번호와 같아야 합니다. 이 휴대전화에 저장되어 다음부터는 자동으로 연결됩니다.</div>
  </section>

  <div id="main" class="hide" style="display:flex;flex-direction:column;gap:14px">
    <!-- 현황 -->
    <section class="card now" aria-live="polite">
      <div class="phase"><b id="phase">상태 확인 중…</b><span class="pill" id="pcPill">PC 확인 중</span></div>
      <div class="title" id="title"></div>
      <div>
        <div class="sub" id="clockLabel">상영 시작까지</div>
        <div class="clock" id="clock">--:--</div>
      </div>
      <div class="bar hide" id="trBarBox"><i id="trBar"></i></div>
      <dl class="facts" id="facts"></dl>
    </section>

    <div id="controls" style="display:flex;flex-direction:column;gap:14px">
      <!-- 상영 시각 -->
      <section class="card">
        <h2>상영 시각 변경</h2>
        <div class="grid4">
          <button type="button" data-shift="-5">−5분</button>
          <button type="button" data-shift="-1">−1분</button>
          <button type="button" data-shift="1">+1분</button>
          <button type="button" data-shift="5">+5분</button>
        </div>
        <div class="row">
          <input id="newTime" type="time" step="1" aria-label="새 상영 시각">
          <button type="button" class="outline" id="btnSetTime" style="flex:0 0 124px;white-space:nowrap">이 시각으로</button>
        </div>
      </section>

      <!-- 화면 전환 -->
      <section class="card">
        <h2>화면 전환</h2>
        <div class="grid2">
          <button type="button" class="outline" id="btnTrailer">예고편 재생</button>
          <button type="button" class="outline" id="btnInfo">영화 정보(줄거리) 화면</button>
        </div>
        <label class="switch" for="auto">예고편 자동 재생 (정보 화면 뒤에 이어서)<input type="checkbox" id="auto" checked></label>
        <button type="button" id="btnAnnounce">바로 안내방송으로 넘어가기</button>
      </section>

      <!-- 예고편 소리 -->
      <section class="card">
        <h2>예고편 소리</h2>
        <div class="vol">
          <input id="vol" type="range" min="0" max="100" step="5" value="100" aria-label="예고편 음량">
          <b id="volNum">100%</b>
        </div>
        <button type="button" id="btnMute" aria-pressed="false">소리 끄기</button>
      </section>

      <!-- 공지 -->
      <section class="card">
        <h2>공지 올리기</h2>
        <textarea id="notice" rows="3" maxlength="200" placeholder="상영 화면 위쪽에 표시할 공지를 입력하세요"></textarea>
        <div class="presets" id="presets">
          <button type="button">잠시 후 상영이 시작됩니다. 자리에 앉아 주세요.</button>
          <button type="button">상영이 10분 지연됩니다. 양해 부탁드립니다.</button>
          <button type="button">상영 중에는 출입문을 닫아 주세요.</button>
        </div>
        <button type="button" class="outline" id="btnAddNotice">목록에 추가 (여러 개를 돌려가며 표시)</button>
        <ol class="nlist hide" id="nlist"></ol>
        <div class="row hide" id="everyRow">
          <label for="noticeEvery" style="flex:0 0 auto;align-self:center">전환 간격</label>
          <select id="noticeEvery">
            <option value="5">5초마다</option>
            <option value="8" selected>8초마다</option>
            <option value="12">12초마다</option>
            <option value="20">20초마다</option>
          </select>
        </div>
        <div class="row">
          <select id="noticeSec" aria-label="공지 표시 시간" style="flex:0 0 130px">
            <option value="30">30초 동안</option>
            <option value="60" selected>1분 동안</option>
            <option value="180">3분 동안</option>
            <option value="600">10분 동안</option>
            <option value="0">내릴 때까지</option>
          </select>
          <button type="button" class="primary" id="btnNotice">공지 올리기</button>
        </div>
        <button type="button" id="btnNoticeClear">공지 내리기</button>
      </section>

      <!-- 종료 -->
      <section class="card">
        <h2>프리쇼 종료</h2>
        <button type="button" class="danger" id="btnClose">상영 화면 닫기</button>
        <div class="hint">대기화면을 닫고 세팅 화면으로 돌아갑니다. 한 번 더 눌러야 실행됩니다.</div>
      </section>
    </div>

    <button type="button" id="btnLogout">비밀번호 다시 입력</button>
  </div>
</div>
<div id="toast" role="status"></div>

<script src="mqtt.min.js"></script>
<script src="relay.js"></script>
<script src="remote.js"></script>
</body>
</html>
